# Local databases for development: PostgreSQL (through Prisma) and MongoDB (logs).
# Start them with:  docker compose up -d
# The passwords below are development defaults; override them in .env.
# Postgres listens on 5433 so it doesn't collide with another local Postgres on 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: asc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-asc}
    ports:
      - "5433:5432"
    volumes:
      - asc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asc-postgres-data:
